<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase (kostenlos, Spark-Plan) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --paper: #EDEAE1;
    --paper-card: #F8F6EF;
    --ink: #262421;
    --ink-soft: #7A7266;
    --ink-faint: #A69E8F;
    --accent: #3F5B4D;
    --accent-dim: #C9D3C7;
    --accent-pale: #E4E9E1;
    --line: #D9D4C7;
    --danger: #9C4B3F;
    --danger-pale: #F1E3E0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Lora', Georgia, serif; min-height: 100vh; }
  .app { display: flex; min-height: 100vh; max-width: 1080px; margin: 0 auto; }

  /* ---- Login screen ---- */
  .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 100vh; text-align: center; padding: 20px; }
  .login-screen h1 { font-family: 'Fraunces', serif; font-size: 34px; margin: 0 0 8px; }
  .login-screen p { font-family: 'Inter', sans-serif; color: var(--ink-soft); margin: 0 0 28px; max-width: 380px; }
  .google-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; background: var(--accent); color: var(--paper-card); border: none; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
  .google-btn:hover { background: #33473c; }
  .config-warning { max-width: 480px; margin-top: 24px; padding: 16px 18px; background: var(--paper-card); border: 1px solid var(--line); border-radius: 8px; text-align: left; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .config-warning code { background: var(--accent-pale); padding: 1px 5px; border-radius: 3px; }

  /* ---- Sidebar ---- */
  .sidebar { width: 230px; flex-shrink: 0; padding: 32px 18px 32px 28px; border-right: 1px solid var(--line); position: sticky; top: 0; align-self: flex-start; max-height: 100vh; overflow-y: auto; }
  .brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin: 0 0 2px 0; }
  .brand-sub { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px 0; }
  .account-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 8px; }
  .account-email { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
  .logout-btn { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
  .month-group { margin-bottom: 20px; }
  .month-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 8px 2px; }
  .day-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: none; background: transparent; border-radius: 5px; cursor: pointer; text-align: left; font-family: 'Lora', serif; color: var(--ink); }
  .day-link:hover { background: var(--accent-pale); }
  .day-num { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 500; width: 20px; }
  .day-weekday { font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--ink-soft); flex: 1; }
  .day-count { font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--ink-faint); background: var(--accent-pale); border-radius: 8px; padding: 1px 6px; }
  .empty-sidebar { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink-faint); line-height: 1.6; padding: 4px 2px; }

  /* ---- Main / composer / feed ---- */
  .main { flex: 1; min-width: 0; padding: 48px 56px 80px; }
  .weekday { font-family: 'Fraunces', serif; font-weight: 600; font-size: 38px; line-height: 1.05; margin: 0; letter-spacing: -0.01em; }
  .full-date { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink-soft); margin: 4px 0 0 0; }
  .underline-svg { display: block; width: 170px; height: 10px; margin: 10px 0 22px 0; }

  .paper-wrap { position: relative; background: var(--paper-card); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px 20px 36px; }
  .paper-wrap::before { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 1px; background: var(--accent-dim); }
  textarea.ruled { width: 100%; resize: vertical; border: none; outline: none; background: transparent;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 30px, var(--line) 31px);
    background-position: 0 4px; font-family: 'Lora', Georgia, serif; font-size: 16px; line-height: 31px; color: var(--ink); padding: 0; }
  textarea.ruled::placeholder { color: var(--ink-faint); font-style: italic; }
  #composer-text { min-height: 130px; }

  .toolbar { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--accent); color: var(--paper-card); border: none; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .btn:hover { background: #33473c; }
  .btn:disabled { background: var(--ink-faint); cursor: default; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--accent-pale); color: var(--ink); }
  .btn-danger-text { background: none; border: none; color: var(--danger); font-family: 'Inter', sans-serif; font-size: 12.5px; cursor: pointer; text-decoration: underline; padding: 0; }
  .btn-link { background: none; border: none; color: var(--accent); font-family: 'Inter', sans-serif; font-size: 12.5px; cursor: pointer; text-decoration: underline; padding: 0; }

  .status { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-faint); min-height: 16px; }
  .status.saved { color: var(--accent); }
  .status.error { color: var(--danger); }

  .feed-divider { display: flex; align-items: center; gap: 14px; margin: 44px 0 22px 0; }
  .feed-divider-line { flex: 1; height: 1px; background: var(--line); }
  .feed-divider-label { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }

  .date-group { margin-bottom: 36px; scroll-margin-top: 24px; }
  .date-group-heading { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 14px 0; }
  .date-group-heading .sub { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12.5px; color: var(--ink-faint); margin-left: 8px; }

  .entry-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px; margin-bottom: 14px; }
  .entry-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .entry-time { font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--ink-faint); }
  .entry-actions { display: flex; gap: 12px; }
  .entry-text { font-family: 'Lora', Georgia, serif; font-size: 15.5px; line-height: 1.65; white-space: pre-wrap; margin: 0; }
  .entry-edit-toolbar { display: flex; gap: 10px; margin-top: 12px; }

  .empty-feed { font-family: 'Inter', sans-serif; color: var(--ink-faint); font-size: 13.5px; padding: 10px 0; }

  .loading-state { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink-soft); padding: 40px 0; }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); padding: 20px 20px 16px; position: static; max-height: none; }
    .month-group .day-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .month-label { display: none; }
    .day-link { flex-direction: column; align-items: center; gap: 2px; min-width: 56px; padding: 8px 6px; }
    .day-count { display: none; }
    .main { padding: 28px 20px 60px; }
    .weekday { font-size: 28px; }
    .paper-wrap { padding: 18px 16px 16px 28px; }
  }
</style>
</head>
<body>

<div id="root">
  <div class="login-screen"><div class="loading-state">Lade …</div></div>
</div>

<script>
/* ============================================================
   HIER DEINE FIREBASE-KONFIGURATION EINTRAGEN
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAWunZXyCgmwfueuORmexMEOdXMe7dHwMM",
  authDomain: "tagebuch-6fb5f.firebaseapp.com",
  projectId: "tagebuch-6fb5f",
  storageBucket: "tagebuch-6fb5f.firebasestorage.app",
  messagingSenderId: "199355621847",
  appId: "1:199355621847:web:61178012939f6aa54beb92"
};
/* ============================================================ */

const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "DEIN_API_KEY";

const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const weekdayNames = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

let entries = {};        // { id: { id, date: 'YYYY-MM-DD', text, createdAt, updatedAt } }
let currentUser = null;
let db = null;
let editingId = null;    // id of entry currently being edited, or null

function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function pad(n) { return String(n).padStart(2, '0'); }
function isoToDate(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatFullDate(iso) { const d = isoToDate(iso); return weekdayNames[d.getDay()] + ', ' + d.getDate() + '. ' + monthNames[d.getMonth()] + ' ' + d.getFullYear(); }
function formatWeekdayShort(iso) { return weekdayNames[isoToDate(iso).getDay()].slice(0,2); }
function formatTime(iso) { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' Uhr'; }
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function renderLogin() {
  const root = document.getElementById('root');
  if (CONFIG_IS_PLACEHOLDER) {
    root.innerHTML = `
      <div class="login-screen">
        <h1>Tagebuch</h1>
        <p>Bevor die App läuft, muss die Firebase-Konfiguration im Code eingetragen werden.</p>
        <div class="config-warning">
          Ersetze das <code>firebaseConfig</code>-Objekt oben im <code>&lt;script&gt;</code> mit deinen
          eigenen Werten aus der Firebase-Konsole (Projekteinstellungen → Meine Apps → Web-App).
        </div>
      </div>`;
    return;
  }
  root.innerHTML = `
    <div class="login-screen">
      <h1>Tagebuch</h1>
      <p>Melde dich mit deinem Google-Konto an, um deine Einträge auf jedem Gerät zu sehen.</p>
      <button class="google-btn" id="login-btn">Mit Google anmelden</button>
    </div>`;
  document.getElementById('login-btn').addEventListener('click', () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(err => alert('Anmeldung fehlgeschlagen: ' + err.message));
  });
}

function renderShell() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="app">
      <aside class="sidebar">
        <p class="brand">Tagebuch</p>
        <p class="brand-sub">Persönliche Einträge</p>
        <div class="account-row">
          <span class="account-email" title="${currentUser.email || ''}">${currentUser.email || currentUser.displayName || ''}</span>
          <button class="logout-btn" id="logout-btn" type="button">Abmelden</button>
        </div>
        <div id="sidebar-list"><div class="empty-sidebar">Lade Einträge …</div></div>
      </aside>
      <main class="main" id="main-content"><div class="loading-state">Einen Moment …</div></main>
    </div>`;
  document.getElementById('logout-btn').addEventListener('click', () => firebase.auth().signOut());
}

async function loadEntries() {
  try {
    const doc = await db.collection('diary').doc(currentUser.uid).get();
    entries = doc.exists && doc.data().entries ? JSON.parse(doc.data().entries) : {};
  } catch (err) {
    entries = {};
  }
}

async function persistEntries() {
  await db.collection('diary').doc(currentUser.uid).set({ entries: JSON.stringify(entries) });
}

/* ---------- derived data ---------- */
function entriesByDateDesc() {
  const byDate = {};
  Object.values(entries).forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });
  Object.values(byDate).forEach(list => list.sort((a, b) => a.createdAt.localeCompare(b.createdAt)));
  const dates = Object.keys(byDate).sort().reverse();
  return { byDate, dates };
}

/* ---------- sidebar ---------- */
function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const { byDate, dates } = entriesByDateDesc();

  if (dates.length === 0) {
    list.innerHTML = '<div class="empty-sidebar">Noch keine Einträge.<br>Schreib deinen ersten Gedanken auf.</div>';
    return;
  }

  const byMonth = {};
  dates.forEach(iso => {
    const d = isoToDate(iso);
    const key = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(iso);
  });

  let html = '';
  Object.keys(byMonth).sort().reverse().forEach(monthKey => {
    const [y, m] = monthKey.split('-').map(Number);
    html += `<div class="month-group"><p class="month-label">${monthNames[m-1]} ${y}</p><div class="day-list">`;
    byMonth[monthKey].forEach(iso => {
      const d = isoToDate(iso);
      const count = byDate[iso].length;
      html += `<button class="day-link" data-date="${iso}" type="button">
        <span class="day-num">${pad(d.getDate())}</span>
        <span class="day-weekday">${formatWeekdayShort(iso)}</span>
        <span class="day-count">${count}</span>
      </button>`;
    });
    html += `</div></div>`;
  });

  list.innerHTML = html;
  list.querySelectorAll('.day-link').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById('group-' + btn.getAttribute('data-date'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

/* ---------- main (composer + feed) ---------- */
function renderMain() {
  const main = document.getElementById('main-content');
  const todayIso = todayISO();

  main.innerHTML = `
    <div class="date-heading">
      <h1 class="weekday">${weekdayNames[isoToDate(todayIso).getDay()]}</h1>
      <p class="full-date">${formatFullDate(todayIso)} · heute</p>
    </div>
    <svg class="underline-svg" viewBox="0 0 170 10" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 6 C 28 2, 48 9, 76 5 S 124 2, 168 6" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="paper-wrap">
      <textarea class="ruled" id="composer-text" placeholder="Was beschäftigt dich gerade?"></textarea>
    </div>
    <div class="toolbar">
      <button class="btn" id="composer-save">Eintrag hinzufügen</button>
      <span class="status" id="composer-status"></span>
    </div>
    <div id="feed"></div>
  `;

  document.getElementById('composer-save').addEventListener('click', addComposerEntry);
  document.getElementById('composer-text').addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') addComposerEntry();
  });

  renderFeed();
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const { byDate, dates } = entriesByDateDesc();

  if (dates.length === 0) {
    feed.innerHTML = `
      <div class="feed-divider"><div class="feed-divider-line"></div><span class="feed-divider-label">Bisherige Einträge</span><div class="feed-divider-line"></div></div>
      <p class="empty-feed">Noch nichts hier — dein erster Eintrag erscheint hier, sobald du speicherst.</p>`;
    return;
  }

  let html = `<div class="feed-divider"><div class="feed-divider-line"></div><span class="feed-divider-label">Bisherige Einträge</span><div class="feed-divider-line"></div></div>`;

  dates.forEach(iso => {
    const isToday = iso === todayISO();
    html += `<section class="date-group" id="group-${iso}">
      <h2 class="date-group-heading">${formatFullDate(iso)}${isToday ? '<span class="sub">heute</span>' : ''}</h2>`;
    byDate[iso].forEach(entry => {
      html += renderEntryCard(entry);
    });
    html += `</section>`;
  });

  feed.innerHTML = html;
  attachFeedListeners();
}

function renderEntryCard(entry) {
  const editedNote = entry.updatedAt !== entry.createdAt ? ' · bearbeitet ' + formatTime(entry.updatedAt) : '';
  if (editingId === entry.id) {
    return `
      <article class="entry-card" data-id="${entry.id}">
        <textarea class="ruled" data-edit-text style="min-height:100px">${escapeHtml(entry.text)}</textarea>
        <div class="entry-edit-toolbar">
          <button class="btn" data-action="save-edit">Speichern</button>
          <button class="btn btn-ghost" data-action="cancel-edit">Abbrechen</button>
        </div>
      </article>`;
  }
  return `
    <article class="entry-card" data-id="${entry.id}">
      <div class="entry-meta">
        <span class="entry-time">${formatTime(entry.createdAt)}${editedNote}</span>
        <span class="entry-actions">
          <button class="btn-link" data-action="edit">Bearbeiten</button>
          <button class="btn-danger-text" data-action="delete">Löschen</button>
        </span>
      </div>
      <p class="entry-text">${escapeHtml(entry.text)}</p>
    </article>`;
}

function attachFeedListeners() {
  const feed = document.getElementById('feed');
  feed.querySelectorAll('.entry-card').forEach(card => {
    const id = card.getAttribute('data-id');
    const editBtn = card.querySelector('[data-action="edit"]');
    const deleteBtn = card.querySelector('[data-action="delete"]');
    const saveBtn = card.querySelector('[data-action="save-edit"]');
    const cancelBtn = card.querySelector('[data-action="cancel-edit"]');

    if (editBtn) editBtn.addEventListener('click', () => { editingId = id; renderFeed(); });
    if (cancelBtn) cancelBtn.addEventListener('click', () => { editingId = null; renderFeed(); });
    if (deleteBtn) deleteBtn.addEventListener('click', () => deleteEntry(id));
    if (saveBtn) saveBtn.addEventListener('click', () => {
      const textarea = card.querySelector('[data-edit-text]');
      saveEditedEntry(id, textarea.value);
    });
  });
}

async function addComposerEntry() {
  const textarea = document.getElementById('composer-text');
  const status = document.getElementById('composer-status');
  const text = textarea.value.trim();
  if (!text) return;

  const now = new Date().toISOString();
  const id = genId();
  entries[id] = { id, date: todayISO(), text, createdAt: now, updatedAt: now };

  const saveBtn = document.getElementById('composer-save');
  saveBtn.disabled = true;
  status.textContent = 'Speichere …';
  status.className = 'status';
  try {
    await persistEntries();
    textarea.value = '';
    status.textContent = 'Gespeichert';
    status.className = 'status saved';
    renderSidebar();
    renderFeed();
  } catch (err) {
    delete entries[id];
    status.textContent = 'Speichern fehlgeschlagen. Bitte erneut versuchen.';
    status.className = 'status error';
  } finally {
    saveBtn.disabled = false;
  }
}

async function saveEditedEntry(id, newText) {
  const text = newText.trim();
  if (!text) return;
  const prev = { ...entries[id] };
  entries[id].text = text;
  entries[id].updatedAt = new Date().toISOString();
  try {
    await persistEntries();
    editingId = null;
    renderFeed();
  } catch (err) {
    entries[id] = prev;
    alert('Speichern fehlgeschlagen. Bitte erneut versuchen.');
    renderFeed();
  }
}

async function deleteEntry(id) {
  if (!confirm('Diesen Eintrag wirklich löschen? Das kann nicht rückgängig gemacht werden.')) return;
  const backup = entries[id];
  delete entries[id];
  try {
    await persistEntries();
    renderSidebar();
    renderFeed();
  } catch (err) {
    entries[id] = backup;
    alert('Löschen fehlgeschlagen. Bitte erneut versuchen.');
    renderFeed();
  }
}

function init() {
  if (CONFIG_IS_PLACEHOLDER) { renderLogin(); return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();

  firebase.auth().onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      renderShell();
      await loadEntries();
      renderSidebar();
      renderMain();
    } else {
      currentUser = null;
      renderLogin();
    }
  });
}

init();
</script>
</body>
</html>
